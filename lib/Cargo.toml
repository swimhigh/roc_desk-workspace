[package]
name = "roc_desk_workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
roc_desk_core = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_core", tag = "common-v0.13.0" }
roc_desk_common = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_common", tag = "common-v0.13.0" }
# Local filesystem browsing/editing + root-path-keyed symbol index +
# embeddable <EditorPane/> all come from roc_desk-editor (which itself
# re-exports roc_desk-explorer) instead of being reimplemented here -- see
# lib/src/lib.rs for the rationale.
roc_desk_editor = { git = "https://github.com/swimhigh/roc_desk-editor", package = "roc_desk_editor", tag = "v0.2.12" }
roc_desk_explorer = { git = "https://github.com/swimhigh/roc_desk-explorer", package = "roc_desk_explorer", tag = "v0.2.12" }
# Remote (SSH/Agent) workspace support -- resolves a connection_id into an
# actual connection/FileOps, which roc_desk_core::workspace deliberately
# cannot do itself (it never depends on roc_desk-ssh). See
# WorkspaceAppState::new_with_ssh in lib.rs for how the pools get here.
roc_desk_ssh = { git = "https://github.com/swimhigh/roc_desk-ssh", package = "roc_desk_ssh", tag = "v0.3.9" }
roc_desk_protocol = { git = "https://github.com/swimhigh/roc_desk-ssh", package = "roc_desk_protocol", tag = "v0.3.9" }
tauri = { version = "2" }
tokio = { version = "1", features = ["sync", "process", "fs", "rt-multi-thread", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
similar = "2"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
chrono = "0.4"
tracing = "0.1"
async-trait = "0.1"
tokio-util = "0.7"
sha2 = "0.10"
base64 = "0.22"
